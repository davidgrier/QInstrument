[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "QInstrument"
version = "3.1.0"
description = "Qt-based framework for controlling scientific instruments over serial ports"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = ["scientific instruments", "serial port", "Qt", "laboratory automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20",
    "qtpy>=2.0",
]

[project.optional-dependencies]
tree = [
    "pyqtgraph>=0.13",
]
docs = [
    "sphinx>=8.0",
    "pydata-sphinx-theme>=0.16",
    "sphinx-autodoc-typehints>=2.0",
]
test = [
    "QInstrument[tree]",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-qt>=4.0",
]
pyqt5 = ["PyQt5>=5.15"]
pyqt6 = ["PyQt6"]
pyside6 = ["PySide6>=6.7"]
dev-pyqt5 = ["QInstrument[test]", "PyQt5>=5.15"]
dev-pyqt6 = ["QInstrument[test]", "PyQt6"]
dev-pyside6 = ["QInstrument[test]", "PySide6>=6.7"]
dev = ["QInstrument[test]", "PyQt6", "ruff", "pyright==1.1.414", "pre-commit"]

[project.gui-scripts]
qinstrument = "QInstrument.__main__:main"

[project.urls]
Homepage = "https://github.com/davidgrier/QInstrument"
Repository = "https://github.com/davidgrier/QInstrument"
Documentation = "https://qinstrument.readthedocs.io"
Changelog = "https://github.com/davidgrier/QInstrument/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/davidgrier/QInstrument/issues"

# The project root IS the QInstrument package — no src/ subdirectory.
# package-dir maps the Python package name to the filesystem root.
[tool.setuptools]
package-dir = {"QInstrument" = "."}
packages = [
    "QInstrument",
    "QInstrument.lib",
    "QInstrument.widgets",
    "QInstrument.instruments",
    "QInstrument.instruments.StanfordResearch",
    "QInstrument.instruments.StanfordResearch.DS345",
    "QInstrument.instruments.StanfordResearch.SR830",
    "QInstrument.instruments.StanfordResearch.SR844",
    "QInstrument.instruments.IPGPhotonics",
    "QInstrument.instruments.IPGPhotonics.IPGLaser",
    "QInstrument.instruments.Novanta",
    "QInstrument.instruments.Novanta.Opus",
    "QInstrument.instruments.Novanta.Opus532",
    "QInstrument.instruments.Novanta.Opus660",
    "QInstrument.instruments.Novanta.Opus1064",
    "QInstrument.instruments.PiezoDrive",
    "QInstrument.instruments.PiezoDrive.PDUS210",
    "QInstrument.instruments.PriorScientific",
    "QInstrument.instruments.PriorScientific.Proscan",
    "QInstrument.instruments.Tektronix",
    "QInstrument.instruments.Tektronix.TDS1000",
]

[tool.setuptools.package-data]
"QInstrument" = ["**/*.ui", "**/*.png"]

[tool.setuptools.exclude-package-data]
"QInstrument" = [".qi/**", "tests/**", "docs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
# The environment lives in the tree, in .qi.
extend-exclude = [".qi", "docs/_build"]

[tool.ruff.lint]
# F pyflakes, B bugbear, E501 line length, Q quotes, SIM simplifications
# (except SIM905), PERF performance, PIE misc, RUF012 mutable class
# attributes, RUF100 stale noqa, UP037 quoted annotations; E402 imports at
# the top, E731 lambda assigned, E741 ambiguous name, RUF015 first element,
# RUF059 unused unpacked variable, PLW0108 needless lambda, PLW1510
# subprocess without check, TID252 a relative import of a parent (a sibling
# is imported as `.name`), A001 and A002 a name that hides a builtin, C400
# and C401 a generator that is a comprehension, PLW2901 a loop variable that
# is overwritten.
select = ["F", "B", "E402", "E501", "E731", "E741", "Q", "SIM", "PERF",
          "PIE", "PLW0108", "PLW1510", "PLW2901", "RUF012", "RUF015",
          "RUF059", "RUF100", "TID252", "UP037", "A001", "A002", "C400",
          "C401"]
ignore = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# Package files re-export names; tests build stubs and mocks.
"__init__.py" = ["F401"]
# Sphinx reads the name `copyright`.
"docs/conf.py" = ["A001", "E402"]
# Tests import after patching, unpack to name what they do not use, keep a
# temporary file open across a test, and are not held to the style rules
# that simplify code (a lambda in a test is often late binding on purpose,
# and a test runs a child process without a check).
"tests/*" = ["E402", "E501", "F401", "F811", "F841", "B018", "B905",
             "RUF012", "RUF059", "SIM", "PERF", "PIE", "PLW2901",
             "UP037", "PLW0108", "PLW1510", "E731", "RUF015", "A002"]

[tool.pyright]
# Type checking of the program, not the tests.  The report is empty and CI
# fails on an error.  Widgets built by uic.loadUi read their children from
# .ui files, which pyright cannot see: modules generated from those files
# (python -m QInstrument.lib.uitypes) declare them.  Run it in an
# environment with PyQt6 and no other Qt binding, as CI does.  qtpy does not
# declare Slot and Signal as exports of its modules
# (reportPrivateImportUsage), and the Qt stubs type the arguments of event
# handlers as Optional (reportIncompatibleMethodOverride): neither says
# anything about our code.
include = ["lib", "widgets", "instruments", "QInstrumentRack.py",
           "__main__.py", "__init__.py"]
exclude = ["**/__pycache__", ".qi"]
pythonVersion = "3.11"
extraPaths = [".."]
reportPrivateImportUsage = "none"
reportIncompatibleMethodOverride = "none"
reportUnsupportedDunderAll = "none"

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/docs/*",
    "*/.qi/*",
]

[tool.coverage.report]
# A floor under the measured 81% (2026-11-17).  Raise it as the tests are
# written; never lower it.
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    # The example() of a module is a demonstration that opens a window.
    "def example\\(",
]
