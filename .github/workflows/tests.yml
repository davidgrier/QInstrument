name: Tests

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # The report is empty, so a type error fails the workflow.  Pyright and
    # PyQt6 (whose stubs pyright reads) are pinned: a newer version finds new
    # things, and they are for us to fix when we choose to move (change the
    # pins and the report together).  The stubs of PyQt6 6.12.1 declare the
    # `arguments` keyword of pyqtSignal as required, which every
    # QtCore.Signal(...) call is then reported for.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev-pyqt6]" pyright==1.1.414 PyQt6==6.11.0 PyQt6-Qt6==6.11.0
      - run: pyright

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.qt }}
    runs-on: ubuntu-latest
    # PySide6 is experimental; its failures do not fail the workflow.
    continue-on-error: ${{ matrix.qt == 'pyside6' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        qt: ["pyqt6"]
        include:
          # PyQt5 on the oldest and newest supported Python.
          - python-version: "3.11"
            qt: "pyqt5"
          - python-version: "3.14"
            qt: "pyqt5"
          - python-version: "3.12"
            qt: "pyside6"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0 \
            libfontconfig1 \
            libfreetype6

      - name: Install package and test dependencies
        run: pip install -e ".[dev-${{ matrix.qt }}]"

      # -X faulthandler prints the Python stack of a segfault.
      - name: Run tests
        if: matrix.python-version != '3.12' || matrix.qt != 'pyqt6'
        run: python -X faulthandler -m pytest --tb=short -q

      # One job measures coverage; pyproject.toml sets the floor.
      - name: Run tests with coverage
        if: matrix.python-version == '3.12' && matrix.qt == 'pyqt6'
        run: python -X faulthandler -m pytest --tb=short -q --cov --cov-report=term

  package:
    name: Build and check the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
